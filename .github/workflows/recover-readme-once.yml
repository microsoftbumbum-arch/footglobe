name: Recover README once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-readme-once.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover complete README hunks from staged source
        shell: bash
        run: |
          set -u
          git show 9348263c86102243b6b9f18cfc28cfe4ff52f369:.bootstrap-v9/update.patch.gz > /tmp/update.patch.gz
          gzip -dc /tmp/update.patch.gz > /tmp/update.patch || true

          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          text = Path('/tmp/update.patch').read_text(encoding='utf-8', errors='replace')
          start_marker = 'diff --git a/baseline/README.md b/finalpatch/README.md'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('README diff not found')
          nxt = text.find('\ndiff --git ', start + len(start_marker))
          chunk = text[start:] if nxt < 0 else text[start:nxt]
          lines = chunk.splitlines(keepends=True)

          first_hunk = next((i for i, line in enumerate(lines) if line.startswith('@@ ')), None)
          if first_hunk is None:
              raise SystemExit('README hunk not found')
          header = ''.join(lines[:first_hunk])

          hunk_starts = [i for i, line in enumerate(lines) if line.startswith('@@ ')]
          applied = 0
          skipped = 0
          hunk_re = re.compile(r'^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@')

          for pos, hs in enumerate(hunk_starts):
              he = hunk_starts[pos + 1] if pos + 1 < len(hunk_starts) else len(lines)
              hunk_lines = lines[hs:he]
              m = hunk_re.match(hunk_lines[0])
              if not m:
                  skipped += 1
                  continue
              old_need = int(m.group(2) or '1')
              new_need = int(m.group(4) or '1')
              old_seen = 0
              new_seen = 0
              cut = 1
              complete = False
              for i, line in enumerate(hunk_lines[1:], 1):
                  if line.startswith('\\ No newline at end of file'):
                      cut = i + 1
                      continue
                  if not line:
                      break
                  prefix = line[0]
                  if prefix == ' ':
                      old_seen += 1; new_seen += 1
                  elif prefix == '-':
                      old_seen += 1
                  elif prefix == '+':
                      new_seen += 1
                  else:
                      break
                  cut = i + 1
                  if old_seen == old_need and new_seen == new_need:
                      complete = True
                      break
                  if old_seen > old_need or new_seen > new_need:
                      break

              if not complete:
                  skipped += 1
                  continue

              mini = header + ''.join(hunk_lines[:cut])
              p = Path('/tmp/readme-hunk.patch')
              p.write_text(mini, encoding='utf-8')
              check = subprocess.run(
                  ['git','apply','--check','-p2','--whitespace=nowarn',str(p)],
                  stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
              if check.returncode != 0:
                  skipped += 1
                  print('Skipped hunk:', hunk_lines[0].strip(), check.stderr.splitlines()[:1])
                  continue
              subprocess.run(['git','apply','-p2','--whitespace=nowarn',str(p)], check=True)
              applied += 1
              print('Applied hunk:', hunk_lines[0].strip())

          print(f'README hunks applied={applied} skipped={skipped}')
          PY

          rm -f .github/workflows/recover-readme-once.yml
          rm -f /tmp/update.patch.gz /tmp/update.patch /tmp/readme-hunk.patch

      - name: Publish README recovery and cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: finish README recovery and cleanup'
          git push origin HEAD:main
