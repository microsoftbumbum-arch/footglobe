name: Finalize FootGlobe v9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v9.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover and apply complete patch chunks
        shell: bash
        run: |
          set -u
          gzip -dc .bootstrap-v9/update.patch.gz > /tmp/update.patch || true

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          patch_path = Path('/tmp/update.patch')
          text = patch_path.read_text(encoding='utf-8', errors='replace')
          marker = 'diff --git '
          starts = []
          pos = 0
          while True:
              idx = text.find(marker, pos)
              if idx < 0:
                  break
              starts.append(idx)
              pos = idx + len(marker)

          if not starts:
              raise SystemExit('No diff chunks recovered from staged patch')

          chunks = []
          for i, start in enumerate(starts):
              end = starts[i + 1] if i + 1 < len(starts) else len(text)
              chunks.append(text[start:end])

          applied = 0
          skipped = []
          temp = Path('/tmp/chunk.patch')
          for index, chunk in enumerate(chunks, 1):
              temp.write_text(chunk, encoding='utf-8')
              check = subprocess.run(
                  ['git', 'apply', '--check', '-p2', '--whitespace=nowarn', str(temp)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
              )
              if check.returncode != 0:
                  first = chunk.splitlines()[0] if chunk.splitlines() else f'chunk {index}'
                  skipped.append((index, first, check.stderr.strip()))
                  continue
              subprocess.run(
                  ['git', 'apply', '-p2', '--whitespace=nowarn', str(temp)],
                  check=True,
              )
              applied += 1

          print(f'Applied complete chunks: {applied}/{len(chunks)}')
          if skipped:
              print('Skipped incomplete/non-applicable chunks:')
              for index, first, err in skipped:
                  print(f'  #{index}: {first}')
                  if err:
                      print(f'    {err.splitlines()[0]}')

          if applied == 0:
              raise SystemExit('No complete patch chunks could be applied')
          PY

          rm -rf .bootstrap-v9
          rm -f .github/workflows/finalize-v9.yml
          rm -f /tmp/update.patch /tmp/chunk.patch

      - name: Publish final repository state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: finish FootGlobe refresh and remove temporary files'
          git push origin HEAD:main
