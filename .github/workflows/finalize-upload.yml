name: Finalize FootGlobe upload

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/finalize-upload.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild repository files
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/footglobe.tar.xz
          tar -xJf /tmp/footglobe.tar.xz -C .

          mkdir -p public components/retro
          BASE='https://footglobe.discloud.app'

          for file in earth-day.jpg favicon.ico favicon-512.png favicon-192.png brand-mark.png apple-touch-icon.png footglobe-social-preview.png; do
            curl --fail --location --retry 5 --retry-delay 2 "$BASE/$file" --output "public/$file"
          done

          if curl --fail --location --retry 2 --retry-delay 1 "$BASE/retro-goal-announcement.mp3" --output public/retro-goal-announcement.mp3; then
            python3 - <<'PY'
          from pathlib import Path
          import base64, textwrap
          mp3 = Path('public/retro-goal-announcement.mp3').read_bytes()
          encoded = base64.b64encode(mp3).decode('ascii')
          chunks = textwrap.wrap(encoded, 160)
          lines = '\n'.join(f'  "{chunk}",' for chunk in chunks)
          out = '''"use client";\n\n// Embedded copy of the retro goal announcement so playback remains available\n// even when a static asset request is unavailable.\nexport const RETRO_GOAL_AUDIO_DATA_URL = [\n''' + lines + '''\n].join("").replace(/^/, "data:audio/mpeg;base64,");\n'''
          Path('components/retro/retro-goal-audio-data.ts').write_text(out, encoding='utf-8')
          PY
          else
            rm -f public/retro-goal-announcement.mp3
            cat > components/retro/retro-goal-audio-data.ts <<'EOF'
          "use client";

          // The source deployment no longer exposes the original MP3.
          // Keep the module available so the repository remains buildable.
          export const RETRO_GOAL_AUDIO_DATA_URL = "";
          EOF
          fi

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Remove upload-only files and publish
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f connection-test.txt
          rm -f .github/workflows/finalize-upload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish FootGlobe source'
          git push origin HEAD:main
