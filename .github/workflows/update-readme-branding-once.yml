name: Update README branding once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-readme-branding-once.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update FootGlobe README links and banner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in ('README.md', 'README.pt-BR.md'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = text.replace('https://footglobe.discloud.app', 'https://footglobe.online')
              text = text.replace('https://x.com/emannoel0', 'https://x.com/FootGlobeLive')
              text = text.replace('@emannoel0', '@FootGlobeLive')
              text = text.replace('./public/footglobe-social-preview.png', './public/footglobe-social-preview.webp')
              path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/update-readme-branding-once.yml

      - name: Commit README branding update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.pt-BR.md .github/workflows/update-readme-branding-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: update FootGlobe links and branding'
          git push origin HEAD:main
