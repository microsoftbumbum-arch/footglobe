name: Feature request
description: Suggest an improvement for FootGlobe
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should FootGlobe add or improve?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why is this useful?
      description: Explain the user problem or benefit.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Suggested behavior
      description: Optional flow, UI or technical details.
