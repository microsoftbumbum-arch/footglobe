name: Bug report
description: Report a reproducible FootGlobe problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve FootGlobe. Do not include API keys or private credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Where did it happen?
      options:
        - Mobile browser
        - Desktop browser
        - Both
        - API / server
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Browser, screenshots, console output or other useful details.
